apiVersion: apps/v1
kind: Deployment
metadata:
  name: knab
  labels:
    {{- include "knab.labels" . | nindent 4 }}
spec:
  # SQLite + the in-process sync/backup scheduler assume exactly one process.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "knab.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "knab.selectorLabels" . | nindent 8 }}
    spec:
      # A Service named "knab" would otherwise inject KNAB_PORT=tcp://… and
      # clobber the app's own KNAB_PORT setting.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000     # `node` user in the image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: knab
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: KNAB_BASE_URL
              value: "https://{{ .Values.host }}"
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 4
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: knab-data
        - name: tmp
          emptyDir: {}
