clusterOperator:
  # Extra environment variables to be added to the Cluster Operator container
  extraEnvs:
    - name: STRIMZI_KUBERNETES_VERSION
      value: "1.33" # Adjust this to match your k3s cluster's minor version baseline (e.g., 1.29, 1.30, 1.31)

watchAnyNamespace: true

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    memory: 512Mi
