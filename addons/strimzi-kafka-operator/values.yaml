# Move extraEnvs to the root level when watchAnyNamespace is true
extraEnvs:
  - name: STRIMZI_KUBERNETES_VERSION
    value: "1.33"

watchAnyNamespace: true

clusterOperator:
  # Leave this empty or use it for other operator-specific settings if needed
  # but keep extraEnvs at the root level

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    memory: 512Mi