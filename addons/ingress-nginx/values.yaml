controller:
  replicaCount: 1

  service:
    type: LoadBalancer

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  ingressClassResource:
    name: nginx
    enabled: true
    default: false

  admissionWebhooks:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
